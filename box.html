<html>
    <head>
        <title>Flexbox Example</title>
        <style>
            .container {
              display:grid;
              grid-template-columns: 1fr 2fr;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div>Box1</div>
            <div>Box2</div>
            <div>Box3</div>
            <div>Box4</div>
            
        </div>
        </body>
</html>


<!DOCTYPE html>
<html>

<head>

    <title>Grid Example</title>

    <style>

        .students {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .student {
            padding: 30px;
            background-color: rgb(255, 194, 235);
            text-align:left;
            border-radius: 10px;
        }

    </style>

</head>


<body>

    <div class="students">

        <div class="student">
            Virat
        </div>

        <div class="student">
            Paul artrieds
        </div>

        <div class="student">
            Anakin skywalker
        </div>

        <div class="student">
            Dr Mengeleev
        </div>

        <div class="student">
            Griffith
        </div>

        <div class="student">
            Kaido
        </div>

    </div>

</body>

</html>
